name: Escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  construir-y-probar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Instalar Chromium y Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Probar desde fuente (Windows)
        if: runner.os == 'Windows'
        run: npm run prueba
      - name: Probar desde fuente (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run prueba
      - name: Conservar prueba desde fuente
        if: always()
        shell: bash
        run: |
          if [ -f prueba/salida/resultado.json ]; then
            shopt -s nullglob
            mkdir -p prueba/salida/fuente
            mv prueba/salida/*.png prueba/salida/resultado.json prueba/salida/fuente/
          fi
      - name: Construir Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Construir Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Probar empaquetado (Windows)
        if: runner.os == 'Windows'
        env:
          BUTACA_EJECUTABLE: ${{ github.workspace }}/dist/win-unpacked/Butaca.exe
        run: npm run prueba
      - name: Probar empaquetado (Linux)
        if: runner.os == 'Linux'
        env:
          BUTACA_EJECUTABLE: ${{ github.workspace }}/dist/linux-unpacked/butaca
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run prueba
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-${{ matrix.os }}
          path: prueba/salida/**
      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: butaca-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publicar:
    needs: construir-y-probar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: butaca-*
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
